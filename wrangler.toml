name = "easytier-ws-relay"
main = "./src/worker.js"
compatibility_date = "2023-04-01"

[vars]
# Basic network settings
WS_PATH = "ws"
EASYTIER_PUBLIC_SERVER_NETWORK_NAME = "public_server"
EASYTIER_NETWORK_LENGTH = "24"

# Cross-relay federation (enable to allow relay-to-relay discovery)
# Comma-separated list of remote relay base URLs. The federation endpoint is POST /_federation/sync
REMOTE_RELAY_URLS = ""
EASYTIER_FEDERATION_SECRET = ""
FEDERATION_POLL_INTERVAL_MS = "5000"

# Optional: assign a unique peer id per deployment
# EASYTIER_PEER_ID = "10000011"

# Pure P2P mode (if set to "1", relay avoids relaying data)
EASYTIER_DISABLE_RELAY = "0"
